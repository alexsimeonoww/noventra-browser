    <style include="cr-page-host-style cr-scrollable settings-shared">
      :host {
        display: flex;
        flex-direction: column;
        height: 100%;
        --settings-menu-width: 200px;
        --cr-centered-card-max-width: 820px;
        --cr-section-padding: 24px;
        font-size: 13px;
        font-family: system-ui, sans-serif;
        /* Centered cards has a max-width of var(--cr-centered-card-max-width)
         * and a width of a certain percentage. Therefore, to make room for the
         * cards to be at their max width, the flex-basis of #main needs to be
         * whatever value the percentage of would equal to the max width. */
        --settings-main-basis: calc(var(--cr-centered-card-max-width) /
            var(--cr-centered-card-width-percentage));
      }

      :host-context([settings-refresh-2026]) {
        --settings-menu-width: 250px;
      }

      :host-context([settings-refresh-2026]) cr-toolbar::part(search-field) {
        height: 28px;
        padding: 4px 10px;
      }

      :host-context([settings-refresh-2026]) cr-toolbar::part(search-input) {
        color: var(--color-toolbar-search-field-text-color);
        font-weight: 400;
        line-height: 167%;
      }

      cr-toolbar {
        min-height: 48px;
        border-bottom: 1px solid var(--cr-separator-color);
        --cr-toolbar-center-basis: var(--settings-main-basis);
        --cr-toolbar-header-font-weight: 400;
        --cr-toolbar-search-field-background: var(--cr-card-background-color);
        --cr-toolbar-search-field-prompt-color: var(--cr-secondary-text-color);
        --cr-toolbar-search-field-input-text-color: var(--cr-primary-text-color);
        --cr-toolbar-search-field-input-icon-color: var(--cr-secondary-text-color);
      }

      cr-toolbar:not([narrow]) {
        --cr-toolbar-left-spacer-width: var(--settings-menu-width);
      }

      #container {
        display: flex;
        flex: 1;
        overflow: auto;
        position: relative;
        scrollbar-gutter: stable;
      }

      #left,
      #main,
      #right {
        flex: 1 1 0;
      }

      #left {
        flex: 0 0 var(--settings-menu-width);
        height: 100%;
        border-inline-end: 1px solid var(--cr-separator-color);
        box-sizing: border-box;
        padding-top: 8px;
        position: sticky;
        top: 0;
      }

      #left settings-menu {
        max-height: 100%;
        overflow: auto;
        overscroll-behavior: contain;
        width: var(--settings-menu-width);
      }

      #left[collapsed] settings-menu {
        width: 55px;
      }

      #main {
        flex-basis: var(--settings-main-basis);
        min-width: 0;
        padding-inline: 12px;
      }

      #right {
        flex: 0 1 24px;
      }

      /* Below 860px the existing toolbar menu opens the Settings drawer. */
      @media (max-width: 860px) {
        #main {
          min-width: auto;
          /* Add some padding to make room for borders and to prevent focus
           * indicators from being cropped. */
          padding: 0 3px;
        }
      }

      @media (max-width: 700px) {
        #main {
          min-width: 0;
        }
      }
    </style>
    <settings-prefs id="prefs" prefs="{{prefs}}"></settings-prefs>
    <cr-toolbar id="toolbar"
        page-name="$i18n{settings}"
        clear-label="$i18n{clearSearch}"
        autofocus
        search-prompt="$i18n{searchPrompt}"
        on-cr-toolbar-menu-click="onMenuButtonClick_"
        spinner-active="[[toolbarSpinnerActive_]]"
        menu-label="$i18n{menuButtonLabel}"
        on-search-changed="onSearchChanged_"
        role="banner"
        narrow="{{narrow_}}"
        narrow-threshold="860"
        show-menu="[[getLeftMenuHidden_(narrow_, isSettingsRefresh2026_)]]">
    </cr-toolbar>
    <cr-drawer id="drawer" on-close="onMenuClose_" heading="$i18n{settings}"
        align="$i18n{textdirection}">
      <div slot="body">
        <template is="dom-if" id="drawerTemplate">
          <settings-menu id="drawerMenu" on-iron-activate="onIronActivate_">
          </settings-menu>
        </template>
      </div>
    </cr-drawer>
    <div id="container" class="no-outline cr-scrollable">
      <div id="scrollableShadow" class="cr-scrollable-top-shadow"></div>
      <div id="left"
          hidden$="[[getLeftMenuHidden_(narrow_, isSettingsRefresh2026_)]]"
          collapsed$="[[getLeftMenuCollapsed_(
              narrow_, isSettingsRefresh2026_)]]">
        <settings-menu id="leftMenu"
            collapsed="[[getLeftMenuCollapsed_(
                narrow_, isSettingsRefresh2026_)]]"
            on-iron-activate="onIronActivate_">
        </settings-menu>
      </div>
      <settings-main id="main" prefs="{{prefs}}"
          toolbar-spinner-active="{{toolbarSpinnerActive_}}"
          on-search-finished="onSearchFinished_"
          on-search-result-interaction="onSearchResultInteraction_">
      </settings-main>
      <!-- An additional child of the flex #container to take up space,
           aligned with the right-hand child of the flex toolbar. -->
      <div id="right" hidden$="[[narrow_]]"></div>
    </div>
